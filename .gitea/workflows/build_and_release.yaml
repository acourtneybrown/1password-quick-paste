name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: Publish binaries
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-tags: true
        fetch-depth: 0

    - name: Set up Python 3.9
      uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.9"

    - name: Install pyfred
      run: |
        pip install git+https://gitea.notcharlie.com/acourtneybrown/pyfred-cli@main

    - name: Package
      env:
        REPO: ${{ github.event.repository.name }}
      run: |
        pyfred package --name $REPO

    - name: Build Changelog
      id: github_release
      uses: mikepenz/release-changelog-builder-action@v6.4.0
      with:
        platform: gitea
        baseUrl: ${{ gitea.server_url }}
      env:
        GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

    - name: Create release
      uses: softprops/action-gh-release@v3.0.3
      with:
        files: dist/*.alfredworkflow
        body: ${{ steps.github_release.outputs.changelog }}
